name: Build VulkanMod 1.1

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install ARM64 Cross-Compiler and Build libstdc++.so.6
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        mkdir -p src/main/resources/natives/arm64
        aarch64-linux-gnu-gcc -shared -fPIC -Wl,-soname,libstdc++.so.6 -o src/main/resources/natives/arm64/libstdc++.so.6 libstdcxx_stub.c

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --stacktrace

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: VulkanMod-1.1-build
        path: build/libs/*.jar
